services:
  - type: web
    name: leads-sorter
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # threads/timeout come from gunicorn.conf.py, which gunicorn loads from
    # the repo root — keeping them out of the command means a Web Service
    # created by hand (start command typed into the dashboard) gets them too
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
